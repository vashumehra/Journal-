<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal Paper Template Generator (Word 2010 Compatible)</title>

  <!-- JSZip & FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      display: flex;
      justify-content: center;
    }
    .main-card {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h2 {
      margin-top: 0;
      color: #0b1a30;
      border-bottom: 2px solid #f5a623;
      padding-bottom: 8px;
    }
    .template-box {
      background: #f0fdf4;
      border: 2px dashed #22c55e;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
    }
    .template-box h3 { margin: 0 0 6px 0; color: #15803d; font-size: 16px; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    .btn-generate {
      width: 100%;
      padding: 15px;
      background: #003366;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 20px;
    }
    .btn-generate:hover { background: #002244; }
  </style>
</head>
<body>

<div class="main-card">
  <h2>Template-Based Journal .docx Generator (Word 2010 Fix)</h2>

  <!-- 1. OLD FILE UPLOAD -->
  <div class="template-box">
    <h3>1. Apni Purani Template File Upload Karein (.docx)</h3>
    <p style="margin: 0 0 10px 0; font-size: 13px; color: #475569;">
      Jaisa format chahiye, uski original .docx file select karein:
    </p>
    <input type="file" id="templateFileInput" accept=".docx" style="max-width: 400px; margin: 0 auto; display: block;">
  </div>

  <!-- 2. NEW DETAILS -->
  <div class="grid-2">
    <div>
      <div class="form-group">
        <label>2. Naya Logo Chunein (Image - Optional):</label>
        <input type="file" id="newLogoInput" accept="image/*">
        <small style="color: #64748b; font-size: 11px;">Agar naya logo nahi chunenge to purana logo hi bana rahega.</small>
      </div>

      <div class="form-group">
        <label>Naya Journal Name:</label>
        <input type="text" id="newJournalName" placeholder="Journal Title likhein" value="American Journal of Animal Health & Veterinary Medicine">
      </div>

      <div class="form-group">
        <label>Naya ISSN Code:</label>
        <input type="text" id="newISSN" placeholder="Jaise: 3069-7840" value="3069-7840">
      </div>
    </div>

    <div>
      <div class="grid-2">
        <div class="form-group">
          <label>Naya Volume:</label>
          <input type="text" id="newVolume" placeholder="Jaise: 02" value="01">
        </div>
        <div class="form-group">
          <label>Naya Issue:</label>
          <input type="text" id="newIssue" placeholder="Jaise: 02" value="01">
        </div>
      </div>

      <div class="form-group">
        <label>Naya URL / DOI Link:</label>
        <input type="text" id="newURL" placeholder="https://..." value="https://uscse.com/uscse/index.php/AJAHVM/home">
      </div>
    </div>
  </div>

  <button class="btn-generate" onclick="processAndDownloadTemplate()">Generate Updated MS Word (.docx)</button>
</div>

<script>
  let templateArrayBuffer = null;
  let newLogoArrayBuffer = null;

  // Safe XML string escape taaki Word 2010 file corrupt na maane
  function xmlEscape(str) {
    if (!str) return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  // Load Template File
  document.getElementById('templateFileInput').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (file) {
      templateArrayBuffer = await file.arrayBuffer();
      alert("Template File Load Ho Gayi Hai! Ab naye details check karke Download dabayein.");
    }
  });

  // Load New Logo
  document.getElementById('newLogoInput').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (file) {
      newLogoArrayBuffer = await file.arrayBuffer();
    }
  });

  async function processAndDownloadTemplate() {
    if (!templateArrayBuffer) {
      alert("Kripya pehle apni purani template file (.docx) upload karein!");
      return;
    }

    try {
      const zip = await JSZip.loadAsync(templateArrayBuffer);

      // 1. Logo replace karna (Agar user ne diya hai)
      if (newLogoArrayBuffer) {
        const mediaFolder = zip.folder("word/media");
        if (mediaFolder) {
          mediaFolder.forEach((relativePath, file) => {
            zip.file("word/media/" + relativePath, newLogoArrayBuffer);
          });
        }
      }

      // 2. Safe Text Preparation (XML Safe Escaped)
      const rawName = document.getElementById('newJournalName').value.trim();
      const rawISSN = document.getElementById('newISSN').value.trim();
      const rawVol = document.getElementById('newVolume').value.trim();
      const rawIssue = document.getElementById('newIssue').value.trim();
      const rawURL = document.getElementById('newURL').value.trim();

      const safeName = xmlEscape(rawName);
      const safeURL = xmlEscape(rawURL);
      const safeISSN = xmlEscape(rawISSN);
      const safeVol = xmlEscape(rawVol);
      const safeIssue = xmlEscape(rawIssue);

      // Sabhi Header aur Document files me safely replace karna
      const targetFiles = [];
      zip.forEach((path) => {
        if (path.startsWith("word/header") || path === "word/document.xml") {
          targetFiles.push(path);
        }
      });

      for (let path of targetFiles) {
        let content = await zip.file(path).async("string");

        // Update Volume & Issue safely
        if (safeVol) {
          content = content.replace(/(Volume[:\s]*)[0-9A-Za-z]+/gi, `$1${safeVol}`);
        }
        if (safeIssue) {
          content = content.replace(/(Issue[:\s]*)[0-9A-Za-z]+/gi, `$1${safeIssue}`);
        }

        // Update ISSN safely
        if (safeISSN) {
          content = content.replace(/(ISSN[:\s]*)[0-9\-xX]+/gi, `$1${safeISSN}`);
        }

        // Update URL safely
        if (safeURL) {
          content = content.replace(/https?:\/\/[a-zA-Z0-9\.\/\-_?=&;#]+/gi, safeURL);
        }

        // Update Journal Name safely
        if (safeName) {
          content = content.replace(/American Journal of Animal Health &amp; Veterinary Medicine/gi, safeName);
          content = content.replace(/American Journal of Animal Health & Veterinary Medicine/gi, safeName);
        }

        zip.file(path, content);
      }

      // 3. Generate Validated Docx
      const updatedBlob = await zip.generateAsync({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        compression: "DEFLATE"
      });

      saveAs(updatedBlob, (rawName.substring(0, 15) || "Journal_Paper") + "_Format.docx");

    } catch (err) {
      console.error(err);
      alert("File generate karne me dikkat aayi. Kripya check karein ki file valid .docx hai.");
    }
  }
</script>

</body>
</html>
