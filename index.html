<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal & Ledger</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <!-- ==================== HEADER ==================== -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 flex flex-wrap justify-between items-center gap-4">
            
            <!-- Logo & Title -->
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-800 p-2.5 rounded-lg border border-indigo-700 shadow-inner flex items-center justify-center">
                    <i class="fa-solid fa-book-journal-whills text-amber-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        Journal & Ledger Pro
                        <span class="text-[10px] bg-indigo-700 text-indigo-200 font-semibold px-2 py-0.5 rounded-full border border-indigo-600">v2.0</span>
                    </h1>
                    <p class="text-xs text-indigo-300">Class 11 Commerce & Small Business Accounting</p>
                </div>
            </div>

            <!-- Quick Action Buttons -->
            <div class="flex items-center gap-2.5">
                <button onclick="window.print()" class="px-3.5 py-1.5 text-xs font-medium bg-indigo-800 hover:bg-indigo-700 text-indigo-100 rounded-md border border-indigo-700 shadow-sm flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-print"></i> Print
                </button>
                <a href="#new-entry" class="px-3.5 py-1.5 text-xs font-semibold bg-amber-400 hover:bg-amber-300 text-slate-900 rounded-md shadow flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-plus"></i> New Entry
                </a>
            </div>

        </div>
    </header>

    <!-- Page Content (Placeholder) -->
    <main class="max-w-7xl mx-auto p-6 flex-1 w-full text-center flex flex-col items-center justify-center text-slate-400">
        <i class="fa-solid fa-table-list text-4xl mb-2 text-slate-300"></i>
        <p class="text-sm font-medium">Aapka table ya baki content yahan aayega.</p>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-white border-t border-slate-200 text-slate-600 text-xs">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- Left Info -->
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-scale-balanced text-indigo-600"></i>
                <span class="font-semibold text-slate-800">Double Entry Accounting System</span>
                <span class="text-slate-400">|</span>
                <span>All Debit & Credit Rules Applied</span>
            </div>

            <!-- Right Links & Credit -->
            <div class="flex items-center space-x-4 text-slate-500">
                <span>Auto-saved in Browser</span>
                <span class="text-slate-300">•</span>
                <span class="font-medium text-slate-700">&copy; 2026 Edwin Incorporation</span>
            </div>

        </div>
    </footer>

</body>
</html>
