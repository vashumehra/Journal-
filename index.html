<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Journal Header Generator (.docx)</title>

  <!-- Libraries for MS Word (.docx) generation -->
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      display: flex;
      justify-content: center;
    }
    .main-card {
      width: 100%;
      max-width: 950px;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h2 {
      margin-top: 0;
      color: #0b1a30;
      border-bottom: 2px solid #f5a623;
      padding-bottom: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
    }
    input:focus { border-color: #548DD4; }
    .upload-btn-box {
      border: 2px dashed #94a3b8;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
    }

    /* Live Preview Section (Strictly Bottom Line, No Box) */
    .preview-section {
      margin-top: 25px;
      padding: 20px;
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
    }
    .header-table {
      width: 100%;
      border-collapse: collapse;
      border-bottom: 2.5px solid #548DD4;
      padding-bottom: 6px;
    }
    .logo-td {
      width: 2.09cm;
      padding-right: 12px;
      border-right: 1.5px solid #548DD4;
      vertical-align: middle;
      text-align: center;
    }
    .logo-img {
      width: 2.09cm;
      height: 2.07cm;
      object-fit: contain;
      display: block;
    }
    .content-td {
      padding-left: 14px;
      vertical-align: middle;
    }
    .j-title {
      font-family: 'Segoe UI Black', Impact, sans-serif;
      font-size: 14.5pt;
      line-height: 1.15;
      color: #548DD4;
      font-weight: 900;
      margin: 0;
    }
    .j-sub {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 9pt;
      color: #334155;
      margin-top: 5px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn-create {
      width: 100%;
      padding: 14px;
      background: #003366;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 20px;
    }
    .btn-create:hover { background: #002244; }
  </style>
</head>
<body>

<div class="main-card">
  <h2>Journal Header Generator (.docx)</h2>

  <div class="grid-2">
    <div>
      <div class="form-group">
        <label>Upload This Journal's Logo (PNG/JPG):</label>
        <input type="file" id="userLogoFile" accept="image/png, image/jpeg, image/jpg">
        <small style="color: #64748b; font-size: 11px;">Fixed Size: 2.09 cm Width × 2.07 cm Height</small>
      </div>

      <div class="form-group">
        <label>Journal Full Name (Title - 14.5pt):</label>
        <input type="text" id="jName" placeholder="Enter Journal Name" value="American Journal of Animal Health & Veterinary Medicine">
      </div>

      <div class="form-group">
        <label>ISSN Number (9pt):</label>
        <input type="text" id="jISSN" placeholder="e.g. ISSN: 3069-7840" value="ISSN: 3069-7840">
      </div>
    </div>

    <div>
      <div class="grid-2">
        <div class="form-group">
          <label>Volume:</label>
          <input type="text" id="jVol" placeholder="Volume: 01" value="Volume: 01">
        </div>
        <div class="form-group">
          <label>Issue:</label>
          <input type="text" id="jIssue" placeholder="Issue: 01" value="Issue: 01">
        </div>
      </div>

      <div class="form-group">
        <label>Journal Web Link / DOI URL (9pt):</label>
        <input type="text" id="jURL" placeholder="https://..." value="https://uscse.com/uscse/index.php/AJAHVM/">
      </div>
    </div>
  </div>

  <!-- Realtime Live Preview -->
  <div class="preview-section">
    <div style="font-size: 11px; color: #64748b; font-weight: bold; margin-bottom: 8px;">LIVE SCREEN PREVIEW:</div>

    <table class="header-table">
      <tr>
        <td class="logo-td" id="previewLogoCell" style="display: none;">
          <img id="previewLogoImg" class="logo-img" alt="Uploaded Logo">
        </td>
        <td class="content-td">
          <div id="previewTitle" class="j-title">American Journal of Animal Health & Veterinary Medicine</div>
          <div class="j-sub">
            <span id="previewVolIssue" style="font-weight: 600;">Volume: 01, Issue: 01</span>
            <span style="color: #548DD4; font-weight: bold;">|</span>
            <span id="previewURL" style="color: #1d4ed8; text-decoration: underline;">https://uscse.com/uscse/index.php/AJAHVM/</span>
            <span style="color: #548DD4; font-weight: bold;">|</span>
            <span id="previewISSN" style="font-weight: 600;">ISSN: 3069-7840</span>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <button class="btn-create" onclick="generateCustomWordDoc()">Download MS Word (.docx)</button>
</div>

<script>
  let activeLogoBuffer = null;

  // Har baar naya logo upload karne ka binary reader
  document.getElementById('userLogoFile').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (file) {
      activeLogoBuffer = await file.arrayBuffer();
      const reader = new FileReader();
      reader.onload = function(evt) {
        const logoImg = document.getElementById('previewLogoImg');
        logoImg.src = evt.target.result;
        document.getElementById('previewLogoCell').style.display = 'table-cell';
      };
      reader.readAsDataURL(file);
    } else {
      activeLogoBuffer = null;
      document.getElementById('previewLogoCell').style.display = 'none';
    }
  });

  // Live typing preview
  function refreshPreview() {
    document.getElementById('previewTitle').innerText = document.getElementById('jName').value;
    document.getElementById('previewVolIssue').innerText = document.getElementById('jVol').value + ", " + document.getElementById('jIssue').value;
    document.getElementById('previewURL').innerText = document.getElementById('jURL').value;
    document.getElementById('previewISSN').innerText = document.getElementById('jISSN').value;
  }

  ['jName', 'jVol', 'jIssue', 'jURL', 'jISSN'].forEach(id => {
    document.getElementById(id).addEventListener('input', refreshPreview);
  });

  // MS Word Generation Logic
  async function generateCustomWordDoc() {
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, Header, Footer, AlignmentType, ImageRun, PageNumber } = docx;

    const jName = document.getElementById('jName').value;
    const volIssue = document.getElementById('jVol').value + ", " + document.getElementById('jIssue').value;
    const jURL = document.getElementById('jURL').value;
    const jISSN = document.getElementById('jISSN').value;

    const headerCells = [];

    // 1. Agar user ne is journal ka logo choose kiya hai:
    if (activeLogoBuffer) {
      headerCells.push(new TableCell({
        width: { size: 14, type: WidthType.PERCENTAGE },
        borders: {
          top: { style: BorderStyle.NONE, size: 0 },
          left: { style: BorderStyle.NONE, size: 0 },
          bottom: { style: BorderStyle.SINGLE, size: 18, color: "548DD4" },
          right: { style: BorderStyle.SINGLE, size: 12, color: "548DD4" }
        },
        children: [
          new Paragraph({
            alignment: AlignmentType.CENTER,
            children: [
              new ImageRun({
                data: activeLogoBuffer,
                transformation: { width: 79, height: 78 } // 2.09cm x 2.07cm
              })
            ]
          })
        ]
      }));
    }

    // 2. Text Content (Sirf bottom border, baaki NONE)
    headerCells.push(new TableCell({
      width: { size: activeLogoBuffer ? 86 : 100, type: WidthType.PERCENTAGE },
      borders: {
        top: { style: BorderStyle.NONE, size: 0 },
        left: { style: BorderStyle.NONE, size: 0 },
        right: { style: BorderStyle.NONE, size: 0 },
        bottom: { style: BorderStyle.SINGLE, size: 18, color: "548DD4" }
      },
      children: [
        new Paragraph({
          spacing: { after: 60 },
          children: [
            new TextRun({
              text: jName,
              bold: true,
              color: "548DD4",
              size: 29, // 14.5 pt Segoe UI Black
              font: "Segoe UI Black"
            })
          ]
        }),
        new Paragraph({
          children: [
            new TextRun({ text: volIssue, size: 18, font: "Segoe UI" }), // 9 pt
            new TextRun({ text: "  |  ", color: "548DD4", bold: true, size: 18 }),
            new TextRun({ text: jURL, color: "1D4ED8", underline: {}, size: 18, font: "Segoe UI" }),
            new TextRun({ text: "  |  ", color: "548DD4", bold: true, size: 18 }),
            new TextRun({ text: jISSN, size: 18, font: "Segoe UI" })
          ]
        })
      ]
    }));

    // Header Table (Strictly NO OUTER BOX)
    const headerTable = new Table({
      width: { size: 100, type: WidthType.PERCENTAGE },
      borders: {
        top: { style: BorderStyle.NONE, size: 0 },
        left: { style: BorderStyle.NONE, size: 0 },
        right: { style: BorderStyle.NONE, size: 0 },
        bottom: { style: BorderStyle.SINGLE, size: 18, color: "548DD4" },
        insideHorizontal: { style: BorderStyle.NONE, size: 0 },
        insideVertical: { style: BorderStyle.SINGLE, size: 12, color: "548DD4" }
      },
      rows: [ new TableRow({ children: headerCells }) ]
    });

    // Centered Page Number in Footer
    const footerParagraph = new Paragraph({
      alignment: AlignmentType.CENTER,
      children: [
        new TextRun({ children: [PageNumber.CURRENT], font: "Segoe UI", size: 18, bold: true })
      ]
    });

    // Document with Page Setup: Top 3.34cm, Bottom/Left/Right 2.54cm
    const doc = new Document({
      sections: [{
        properties: {
          page: {
            margin: { top: 1893, bottom: 1440, left: 1440, right: 1440 }
          }
        },
        headers: { default: new Header({ children: [headerTable] }) },
        footers: { default: new Footer({ children: [footerParagraph] }) },
        children: [
          new Paragraph({
            spacing: { before: 200 },
            alignment: AlignmentType.CENTER,
            children: [
              new TextRun({ text: "Research Paper Title", bold: true, size: 30, font: "Times New Roman" })
            ]
          })
        ]
      }]
    });

    Packer.toBlob(doc).then(blob => {
      saveAs(blob, (jName.substring(0, 15) || "Journal") + "_Header.docx");
    });
  }
</script>

</body>
</html>
