<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal Template Updater</title>

  <!-- JSZip & FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      margin: 0;
      padding: 30px 15px;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h2 {
      margin: 0 0 18px 0;
      color: #0b1a30;
      font-size: 20px;
      border-bottom: 2px solid #f5a623;
      padding-bottom: 8px;
    }
    
    /* Drag & Drop Areas */
    .drop-zone {
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s;
    }
    .drop-zone.active {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .drop-zone p {
      margin: 0;
      font-size: 14px;
      color: #334155;
      font-weight: 600;
    }
    .drop-zone span {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }

    .grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #334155;
    }
    .input-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
    }
    .input-group input:focus { border-color: #2563eb; }

    .btn-update {
      width: 100%;
      padding: 14px;
      background: #003366;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 15px;
    }
    .btn-update:hover { background: #002244; }
  </style>
</head>
<body>

<div class="card">
  <h2>Quick Journal Header Updater (.docx)</h2>

  <!-- 1. OLD FILE DROP/UPLOAD -->
  <div class="drop-zone" id="docDropZone" onclick="document.getElementById('docFile').click()">
    <p id="docStatus">📁 1. Purani File Drag & Drop Karein Ya Click Karein (.docx)</p>
    <span>Iski formatting aur header layout jaisi hai waisi hi rahegi</span>
    <input type="file" id="docFile" accept=".docx" style="display: none;">
  </div>

  <!-- 2. LOGO DROP/UPLOAD -->
  <div class="drop-zone" id="logoDropZone" onclick="document.getElementById('logoFile').click()">
    <p id="logoStatus">🖼 2. Naya Logo Drag & Drop Karein Ya Click Karein (Image)</p>
    <span>Purani file ka logo is naye logo se replace ho jayega</span>
    <input type="file" id="logoFile" accept="image/*" style="display: none;">
  </div>

  <!-- 3. BASIC FIELDS -->
  <div class="grid-row">
    <div class="input-group">
      <label>Naya Volume:</label>
      <input type="text" id="valVol" placeholder="e.g. 02">
    </div>
    <div class="input-group">
      <label>Naya Issue:</label>
      <input type="text" id="valIssue" placeholder="e.g. 01">
    </div>
  </div>

  <div class="grid-row">
    <div class="input-group">
      <label>Naya ISSN (Optional):</label>
      <input type="text" id="valISSN" placeholder="e.g. 3069-7840">
    </div>
    <div class="input-group">
      <label>Naya URL (Optional):</label>
      <input type="text" id="valURL" placeholder="https://...">
    </div>
  </div>

  <button class="btn-update" onclick="processOldDocx()">Generate &amp; Download Updated .docx</button>
</div>

<script>
  let docBuffer = null;
  let logoBuffer = null;

  // Setup Drag & Drop
  function setupDrop(dropId, inputId, statusId, type) {
    const dropZone = document.getElementById(dropId);
    const input = document.getElementById(inputId);

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('active');
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        handleFile(input.files[0], type, statusId);
      }
    });

    input.addEventListener('change', () => {
      if (input.files.length) handleFile(input.files[0], type, statusId);
    });
  }

  async function handleFile(file, type, statusId) {
    if (type === 'doc') {
      docBuffer = await file.arrayBuffer();
      document.getElementById(statusId).innerText = "✔ " + file.name + " (File Loaded)";
      document.getElementById(statusId).style.color = "#15803d";
    } else {
      logoBuffer = await file.arrayBuffer();
      document.getElementById(statusId).innerText = "✔ " + file.name + " (Logo Selected)";
      document.getElementById(statusId).style.color = "#15803d";
    }
  }

  setupDrop('docDropZone', 'docFile', 'docStatus', 'doc');
  setupDrop('logoDropZone', 'logoFile', 'logoStatus', 'logo');

  function xmlSafe(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // File Processor
  async function processOldDocx() {
    if (!docBuffer) {
      alert("Pehle apni purani template file (.docx) drop ya select karein!");
      return;
    }

    try {
      const zip = await JSZip.loadAsync(docBuffer);

      // 1. Image replace
      if (logoBuffer) {
        const media = zip.folder("word/media");
        if (media) {
          media.forEach((path) => {
            zip.file("word/media/" + path, logoBuffer);
          });
        }
      }

      // 2. Values
      const vol = document.getElementById('valVol').value.trim();
      const issue = document.getElementById('valIssue').value.trim();
      const issn = document.getElementById('valISSN').value.trim();
      const url = document.getElementById('valURL').value.trim();

      // Sirf header XML update karein taaki Word 2010 corrupt na ho
      const headers = [];
      zip.forEach((path) => {
        if (path.startsWith("word/header") && path.endsWith(".xml")) headers.push(path);
      });

      for (let path of headers) {
        let text = await zip.file(path).async("string");

        if (vol) text = text.replace(/(Volume[:\s]*)[0-9A-Za-z]+/gi, `$1${xmlSafe(vol)}`);
        if (issue) text = text.replace(/(Issue[:\s]*)[0-9A-Za-z]+/gi, `$1${xmlSafe(issue)}`);
        if (issn) text = text.replace(/(ISSN[:\s]*)[0-9\-xX]+/gi, `$1${xmlSafe(issn)}`);
        if (url) {
          text = text.replace(/https?:\/\/[a-zA-Z0-9\.\/\-_?=&;#]+home/gi, xmlSafe(url));
          text = text.replace(/https?:\/\/uscse\.com[^\s<"]*/gi, xmlSafe(url));
        }

        zip.file(path, text);
      }

      // Update URL in rels if provided
      const rels = "word/_rels/header1.xml.rels";
      if (zip.file(rels) && url) {
        let relText = await zip.file(rels).async("string");
        relText = relText.replace(/Target="https?:\/\/uscse\.com[^"]*"/gi, `Target="${xmlSafe(url)}"`);
        zip.file(rels, relText);
      }

      const outputBlob = await zip.generateAsync({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        compression: "DEFLATE"
      });

      saveAs(outputBlob, "Updated_Journal_Paper.docx");

    } catch (e) {
      alert("Error: " + e.message);
    }
  }
</script>

</body>
</html>
