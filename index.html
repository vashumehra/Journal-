<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edwin Incorporation — Journal Template Updater</title>

  <!-- JSZip & FileSaver for Word 2010 Compatible Processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      margin: 0;
      padding: 30px 15px;
      background: #081426;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.45);
      border-top: 4px solid #f5a623;
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .brand-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }
    .brand-title {
      margin: 0;
      color: #003366;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
    }
    .brand-sub {
      margin: 3px 0 0 0;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
    }
    
    /* Drag & Drop Areas */
    .drop-zone {
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    .drop-zone.active {
      border-color: #f5a623;
      background: #eff6ff;
    }
    .drop-zone p {
      margin: 0;
      font-size: 14px;
      color: #1e293b;
      font-weight: 700;
    }
    .drop-zone span {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }

    .grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #334155;
    }
    .input-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
    }
    .input-group input:focus { border-color: #003366; }

    .btn-update {
      width: 100%;
      padding: 14px;
      background: #003366;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn-update:hover { background: #002244; }
  </style>
</head>
<body>

<div class="card">
  <!-- Edwin Incorporation Header Branding -->
  <div class="brand-header">
    <img src="logo.png" alt="Edwin Incorporation" class="brand-logo" onerror="this.src='https://raw.githubusercontent.com/vashumehra/edwin-jobs/main/logo.png'">
    <div>
      <h2 class="brand-title">Edwin Incorporation</h2>
      <p class="brand-sub">Research Paper Header &amp; Footer Automation Portal</p>
    </div>
  </div>

  <!-- 1. OLD FILE DROP / SELECT -->
  <div class="drop-zone" id="docDropZone" onclick="document.getElementById('docFile').click()">
    <p id="docStatus">📁 1. Purani File Drag &amp; Drop Karein (.docx)</p>
    <span>Purani file ka table format, margins aur lines bilkul safe rahengi</span>
    <input type="file" id="docFile" accept=".docx" style="display: none;">
  </div>

  <!-- 2. NEW LOGO DROP / SELECT -->
  <div class="drop-zone" id="logoDropZone" onclick="document.getElementById('logoFile').click()">
    <p id="logoStatus">🖼 2. Naya Journal Logo Drag &amp; Drop Karein (Image)</p>
    <span>Purane logo ki jagah naya logo auto-replace ho jayega (Optional)</span>
    <input type="file" id="logoFile" accept="image/*" style="display: none;">
  </div>

  <!-- 3. BASIC QUICK FIELDS -->
  <div class="grid-row">
    <div class="input-group">
      <label>Naya Volume:</label>
      <input type="text" id="valVol" placeholder="e.g. 02">
    </div>
    <div class="input-group">
      <label>Naya Issue:</label>
      <input type="text" id="valIssue" placeholder="e.g. 01">
    </div>
  </div>

  <div class="grid-row">
    <div class="input-group">
      <label>Naya ISSN (Optional):</label>
      <input type="text" id="valISSN" placeholder="e.g. 3069-7840">
    </div>
    <div class="input-group">
      <label>Naya URL (Optional):</label>
      <input type="text" id="valURL" placeholder="https://uscse.com/...">
    </div>
  </div>

  <button class="btn-update" onclick="processOldDocx()">Generate Updated MS Word (.docx)</button>
</div>

<script>
  let docBuffer = null;
  let logoBuffer = null;

  function setupDrop(dropId, inputId, statusId, type) {
    const dropZone = document.getElementById(dropId);
    const input = document.getElementById(inputId);

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('active');
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        handleFile(input.files[0], type, statusId);
      }
    });

    input.addEventListener('change', () => {
      if (input.files.length) handleFile(input.files[0], type, statusId);
    });
  }

  async function handleFile(file, type, statusId) {
    if (type === 'doc') {
      docBuffer = await file.arrayBuffer();
      document.getElementById(statusId).innerText = "✔ " + file.name + " (Template Loaded)";
      document.getElementById(statusId).style.color = "#15803d";
    } else {
      logoBuffer = await file.arrayBuffer();
      document.getElementById(statusId).innerText = "✔ " + file.name + " (New Logo Selected)";
      document.getElementById(statusId).style.color = "#15803d";
    }
  }

  setupDrop('docDropZone', 'docFile', 'docStatus', 'doc');
  setupDrop('logoDropZone', 'logoFile', 'logoStatus', 'logo');

  function xmlSafe(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function processOldDocx() {
    if (!docBuffer) {
      alert("Kripya pehle apni purani template file (.docx) drop ya select karein!");
      return;
    }

    try {
      const zip = await JSZip.loadAsync(docBuffer);

      // 1. Logo replace in word/media
      if (logoBuffer) {
        const media = zip.folder("word/media");
        if (media) {
          media.forEach((path) => {
            zip.file("word/media/" + path, logoBuffer);
          });
        }
      }

      // 2. Values
      const vol = document.getElementById('valVol').value.trim();
      const issue = document.getElementById('valIssue').value.trim();
      const issn = document.getElementById('valISSN').value.trim();
      const url = document.getElementById('valURL').value.trim();

      // Only update header XML files (Document.xml schemas remain untouched to prevent corruption)
      const headers = [];
      zip.forEach((path) => {
        if (path.startsWith("word/header") && path.endsWith(".xml")) headers.push(path);
      });

      for (let path of headers) {
        let text = await zip.file(path).async("string");

        if (vol) text = text.replace(/(Volume[:\s]*)[0-9A-Za-z]+/gi, `$1${xmlSafe(vol)}`);
        if (issue) text = text.replace(/(Issue[:\s]*)[0-9A-Za-z]+/gi, `$1${xmlSafe(issue)}`);
        if (issn) text = text.replace(/(ISSN[:\s]*)[0-9\-xX]+/gi, `$1${xmlSafe(issn)}`);
        if (url) {
          text = text.replace(/https?:\/\/[a-zA-Z0-9\.\/\-_?=&;#]+home/gi, xmlSafe(url));
          text = text.replace(/https?:\/\/uscse\.com[^\s<"]*/gi, xmlSafe(url));
        }

        zip.file(path, text);
      }

      // Update URL in rels safely
      const rels = "word/_rels/header1.xml.rels";
      if (zip.file(rels) && url) {
        let relText = await zip.file(rels).async("string");
        relText = relText.replace(/Target="https?:\/\/uscse\.com[^"]*"/gi, `Target="${xmlSafe(url)}"`);
        zip.file(rels, relText);
      }

      const outputBlob = await zip.generateAsync({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        compression: "DEFLATE"
      });

      saveAs(outputBlob, "Edwin_Updated_Paper.docx");

    } catch (e) {
      alert("Error: " + e.message);
    }
  }
</script>

</body>
</html>
