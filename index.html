<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edwin Incorporation — Journal Template Updater</title>

  <!-- JSZip & FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      margin: 0;
      padding: 30px 15px;
      background-color: #081426;
      /* Multiple fallback image names for poster */
      background-image: 
        linear-gradient(rgba(8, 20, 38, 0.70), rgba(8, 20, 38, 0.70)), 
        url('bg.jpg'),
        url('bg-banner.jpg'),
        url('background.jpg'),
        url('background.jpg.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Transparent Glass Form Card */
    .card {
      width: 100%;
      max-width: 680px;
      background: rgba(15, 23, 42, 0.75) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid #0056b3;
    }

    /* Sirf Edwin Incorporation wala strip Solid White */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #ffffff !important;
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .brand-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .brand-title {
      margin: 0;
      color: #003366;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-sub {
      margin: 3px 0 0 0;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
    }
    
    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      cursor: pointer;
      margin-bottom: 14px;
      transition: all 0.2s;
    }

    .drop-zone.active {
      border-color: #f5a623;
      background: #ffffff;
    }

    .drop-zone p {
      margin: 0;
      font-size: 14px;
      color: #0f172a;
      font-weight: 700;
    }

    .drop-zone span {
      display: block;
      font-size: 11px;
      color: #475569;
      margin-top: 4px;
    }

    .grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: #ffffff;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
      color: #0f172a;
    }

    .input-group input:focus { 
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
    }

    .btn-update {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 15px;
      transition: background 0.2s;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }

    .btn-update:hover { background: #0369a1; }
  </style>
</head>
<body>

<div class="card">
  <!-- Brand Header: Solid White -->
  <div class="brand-header">
    <img src="logo.png" alt="Edwin Incorporation" class="brand-logo" onerror="this.src='https://raw.githubusercontent.com/vashumehra/edwin-jobs/main/logo.png'">
    <div>
      <h2 class="brand-title">Edwin Incorporation</h2>
      <p class="brand-sub">Research Paper Header &amp; Footer Automation Portal</p>
    </div>
  </div>

  <!-- 1. OLD FILE DROP / SELECT -->
  <div class="drop-zone" id="docDropZone" onclick="document.getElementById('docFile').click()">
    <p id="docStatus">📁 1. OLD File Drag &amp; Drop Karein (.docx)</p>
    <span>OLD file ka table format, margins aur lines bilkul safe rahengi</span>
    <input type="file" id="docFile" accept=".docx" style="display: none;">
  </div>

  <!-- 2. NEW LOGO DROP / SELECT -->
  <div class="drop-zone" id="logoDropZone" onclick="document.getElementById('logoFile').click()">
    <p id="logoStatus">🖼 2. NEW Journal Logo Drag &amp; Drop Karein (Image)</p>
    <span>Purane logo ki jagah NEW logo auto-replace ho jayega (Optional)</span>
    <input type="file" id="logoFile" accept="image/*" style="display: none;">
  </div>

  <!-- 3. BASIC FIELDS -->
  <div class="grid-row">
    <div class="input-group">
      <label>NEW Volume:</label>
      <input type="text" id="valVol" placeholder="e.g. 06">
    </div>
    <div class="input-group">
      <label>NEW Issue:</label>
      <input type="text" id="valIssue" placeholder="e.g. 09">
    </div>
  </div>

  <div class="grid-row">
    <div class="input-group">
      <label>NEW ISSN (Optional):</label>
      <input type="text" id="valISSN" placeholder="e.g. 3036-3069">
    </div>
    <div class="input-group">
      <label>NEW URL (Optional):</label>
      <input type="text" id="valURL" placeholder="https://uscse.com/...">
    </div>
  </div>

  <button class="btn-update" onclick="processOldDocx()">Generate Updated MS Word (.docx)</button>
</div>

<script>
  let docBuffer = null;
  let logoBuffer = null;

  function setupDrop(dropId, inputId, statusId, type) {
    const dropZone = document.getElementById(dropId);
    const input = document.getElementById(inputId);

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('active');
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        handleFile(input.files[0], type, statusId);
      }
    });

    input.addEventListener('change', () => {
      if (input.files.length) handleFile(input.files[0], type, statusId);
    });
  }

  async function handleFile(file, type, statusId) {
    if (type === 'doc') {
      docBuffer = await file.arrayBuffer();
      document.getElementById(statusId).innerText = "✔ " + file.name + " (Template Loaded)";
      document.getElementById(statusId).style.color = "#15803d";
    } else {
      logoBuffer = await file.arrayBuffer();
      document.getElementById(statusId).innerText = "✔ " + file.name + " (New Logo Selected)";
      document.getElementById(statusId).style.color = "#15803d";
    }
  }

  setupDrop('docDropZone', 'docFile', 'docStatus', 'doc');
  setupDrop('logoDropZone', 'logoFile', 'logoStatus', 'logo');

  function xmlSafe(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function processOldDocx() {
    if (!docBuffer) {
      alert("Kripya pehle apni purani template file (.docx) drop ya select karein!");
      return;
    }

    try {
      const zip = await JSZip.loadAsync(docBuffer);

      // 1. Logo replace in word/media
      if (logoBuffer) {
        const media = zip.folder("word/media");
        if (media) {
          media.forEach((path) => {
            zip.file("word/media/" + path, logoBuffer);
          });
        }
      }

      // 2. Form Values
      const vol = document.getElementById('valVol').value.trim();
      const issue = document.getElementById('valIssue').value.trim();
      const issn = document.getElementById('valISSN').value.trim();
      const url = document.getElementById('valURL').value.trim();

      // Scan all header AND footer XML files
      const targetXmls = [];
      zip.forEach((path) => {
        if ((path.startsWith("word/header") || path.startsWith("word/footer")) && path.endsWith(".xml")) {
          targetXmls.push(path);
        }
      });

      for (let path of targetXmls) {
        let text = await zip.file(path).async("string");

        // Volume update
        if (vol) text = text.replace(/(Volume[:\s]*)[0-9A-Za-z]+/gi, `$1${xmlSafe(vol)}`);
        
        // Issue update
        if (issue) text = text.replace(/(Issue[:\s]*)[0-9A-Za-z]+/gi, `$1${xmlSafe(issue)}`);
        
        // ISSN update
        if (issn) text = text.replace(/(ISSN[:\s]*)[0-9\-xX]+/gi, `$1${xmlSafe(issn)}`);
        
        // Complete URL & Link Replacement Logic
        if (url) {
          text = text.replace(/<w:hyperlink[^>]*>[\s\S]*?<\/w:hyperlink>/gi, (match) => {
            return match.replace(/<w:t[^>]*>[\s\S]*?<\/w:t>/gi, `<w:t>${xmlSafe(url)}</w:t>`);
          });

          text = text.replace(/<w:t xml:space="preserve">\s*home<\/w:t>/gi, `<w:t></w:t>`);
          text = text.replace(/<w:t[^>]*>\s*home<\/w:t>/gi, `<w:t></w:t>`);
          text = text.replace(/https?:\/\/uscse\.com\/uscse\/index\.php\/[a-zA-Z0-9_\-\/]+/gi, xmlSafe(url));
        }

        zip.file(path, text);
      }

      // Relationships target URL replacement
      const relFiles = [];
      zip.forEach((path) => {
        if ((path.startsWith("word/_rels/header") || path.startsWith("word/_rels/footer")) && path.endsWith(".rels")) {
          relFiles.push(path);
        }
      });

      for (let rPath of relFiles) {
        if (url) {
          let relText = await zip.file(rPath).async("string");
          relText = relText.replace(/Target="https?:\/\/[^"]+"/gi, `Target="${xmlSafe(url)}"`);
          zip.file(rPath, relText);
        }
      }

      const outputBlob = await zip.generateAsync({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        compression: "DEFLATE"
      });

      saveAs(outputBlob, "Updated_Journal_Paper.docx");

    } catch (e) {
      alert("Error: " + e.message);
    }
  }
</script>

</body>
</html>
